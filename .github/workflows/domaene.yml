name: Sæt domæne på GitHub Pages
on:
  workflow_dispatch:
    inputs:
      https:
        description: "Slå HTTPS-tvang til (true/false)"
        default: "false"
permissions:
  pages: write
  contents: read
jobs:
  domaene:
    runs-on: ubuntu-latest
    steps:
      - name: Sæt custom domain
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          out=$(gh api -X PUT repos/${{ github.repository }}/pages -f cname=detskerigudhjem.dk -F https_enforced=${{ inputs.https }} 2>&1) || true
          echo "::warning::PUT: $(echo $out | tr '\n' ' ' | cut -c1-600)"
          info=$(gh api repos/${{ github.repository }}/pages 2>&1) || true
          echo "::warning::PAGES: $(echo $info | tr '\n' ' ' | cut -c1-900)"
          echo "::warning::DNS: $(dig +short detskerigudhjem.dk A | tr '\n' ' ') / www: $(dig +short www.detskerigudhjem.dk | tr '\n' ' ')"
