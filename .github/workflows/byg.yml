# Bygger detskerigudhjem.dk og lægger den på GitHub Pages.
# Kører hver nat efter Klippen-appens nattetjek, midt på dagen, og når siden rettes.
name: Byg og udgiv
on:
  push:
    branches: [main]
  schedule:
    - cron: "45 1 * * *"   # ca. 03.45 dansk sommertid
    - cron: "5 10 * * *"   # ca. 12.05 – fanger rettelser i løbet af dagen
  workflow_dispatch: {}
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  byg:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with: { python-version: "3.12" }
      - run: python build.py
      - name: Gem sidste gode data
        run: |
          git config user.name "Det sker i Gudhjem"; git config user.email "actions@users.noreply.github.com"
          git add data.json
          if ! git diff --cached --quiet; then git commit -m "Data $(date +%F)" && git push; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with: { path: site }
      - id: deploy
        uses: actions/deploy-pages@v4
